<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="mathruBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="mathruGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#92620c"/>
    </linearGradient>
    <linearGradient id="marianBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="mathruShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#mathruBg)" stroke="url(#mathruGold)" stroke-width="4" filter="url(#mathruShadow)"/>
  
  <!-- Rosary Beads Ring (Decade Circle) -->
  <g fill="url(#mathruGold)" opacity="0.75">
    <circle cx="80" cy="12" r="2.2"/>
    <circle cx="101" cy="16" r="2.2"/>
    <circle cx="121" cy="27" r="2.2"/>
    <circle cx="136" cy="44" r="2.2"/>
    <circle cx="145" cy="65" r="2.2"/>
    <circle cx="147" cy="88" r="2.2"/>
    <circle cx="140" cy="110" r="2.2"/>
    <circle cx="127" cy="129" r="2.2"/>
    <circle cx="108" cy="142" r="2.2"/>
    <circle cx="80" cy="148" r="3"/>
    <circle cx="52" cy="142" r="2.2"/>
    <circle cx="33" cy="129" r="2.2"/>
    <circle cx="20" cy="110" r="2.2"/>
    <circle cx="13" cy="88" r="2.2"/>
    <circle cx="15" cy="65" r="2.2"/>
    <circle cx="24" cy="44" r="2.2"/>
    <circle cx="39" cy="27" r="2.2"/>
    <circle cx="59" cy="16" r="2.2"/>
  </g>

  <!-- Inner Marian Oval Medallion -->
  <ellipse cx="80" cy="64" rx="38" ry="42" fill="#0369a1" stroke="url(#mathruGold)" stroke-width="1.8" opacity="0.35"/>

  <!-- Halo of Blessed Mother Mary & Child -->
  <circle cx="76" cy="46" r="15" fill="none" stroke="url(#mathruGold)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="89" cy="58" r="10" fill="none" stroke="url(#mathruGold)" stroke-width="1.2" opacity="0.85"/>

  <!-- Iconographic Silhouette: Mother Mary with Infant Jesus -->
  <g fill="#ffffff" filter="url(#mathruShadow)">
    <!-- Mother Mary Veil & Robe -->
    <path d="M64 88 C62 70, 66 54, 76 40 C84 38, 88 44, 88 52 C82 54, 78 60, 78 70 C78 78, 80 84, 86 88 Z" fill="url(#marianBlue)"/>
    <!-- Mother Mary Head Profile -->
    <circle cx="76" cy="48" r="5.5" fill="#fef08a"/>
    <path d="M72 48 C72 42, 80 42, 80 48 C80 54, 74 56, 72 48 Z" fill="#ffffff"/>
    <!-- Child Jesus Head -->
    <circle cx="88" cy="59" r="4.5" fill="#fef08a"/>
    <path d="M84 64 C84 59, 92 59, 92 64 C92 72, 86 78, 84 84 L76 84 C76 76, 84 72, 84 64 Z" fill="#ffffff"/>
    <!-- Embracing Maternal Arm -->
    <path d="M68 68 C74 74, 82 76, 88 72" stroke="#d4972e" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Traditional Lamp of the Home (Nilavilakku) Motif at Lower Left -->
  <g transform="translate(42, 82) scale(0.65)" fill="url(#mathruGold)">
    <path d="M0 -6 C-2 -3, -2 0, 0 3 C2 0, 2 -3, 0 -6 Z" fill="#f59e0b"/>
    <path d="M-6 3 L6 3 L4 6 L-4 6 Z"/>
    <rect x="-1" y="6" width="2" height="6"/>
    <ellipse cx="0" cy="13" rx="5" ry="1.5"/>
  </g>

  <!-- White Lily Flower of Purity at Lower Right -->
  <g transform="translate(118, 82) scale(0.65)" stroke="url(#mathruGold)" stroke-width="1.2" fill="#ffffff">
    <path d="M0 0 C-4 -6, -2 -12, 0 -14 C2 -12, 4 -6, 0 0 Z"/>
    <path d="M0 -2 C-6 -4, -10 -8, -12 -6 C-10 -2, -4 0, 0 -2 Z"/>
    <path d="M0 -2 C6 -4, 10 -8, 12 -6 C10 -2, 4 0, 0 -2 Z"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#15803d" stroke-width="2"/>
  </g>

  <!-- Ribbon Banner for Mathruvedi -->
  <path d="M26 114 L38 107 L122 107 L134 114 L122 121 L38 121 Z" fill="#be185d" stroke="url(#mathruGold)" stroke-width="1.5" filter="url(#mathruShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MATHRUVEDI</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcMathru" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.8">
    <textPath href="#textArcMathru" startOffset="50%" text-anchor="middle">
      MALANKARA CATHOLIC MOTHERS FORUM
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">ODANAVATTOM PARISH</text>
  <circle cx="44" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="116" cy="135" r="1.5" fill="#d4972e"/>
</svg>
