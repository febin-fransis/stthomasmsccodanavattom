<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="mcymBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e3a6a"/>
      <stop offset="70%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#071124"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#92620c"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#mcymBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Holy Spirit Radiant Rays -->
  <g opacity="0.35" stroke="#fef08a" stroke-width="1.2">
    <line x1="80" y1="52" x2="80" y2="28"/>
    <line x1="80" y1="52" x2="60" y2="34"/>
    <line x1="80" y1="52" x2="100" y2="34"/>
    <line x1="80" y1="52" x2="45" y2="48"/>
    <line x1="80" y1="52" x2="115" y2="48"/>
  </g>

  <!-- Pentecostal Flame Base -->
  <path d="M68 96 C64 82, 74 74, 80 62 C86 74, 96 82, 92 96 C88 104, 72 104, 68 96 Z" fill="url(#flameGrad)" opacity="0.9"/>
  <path d="M74 96 C72 87, 77 82, 80 74 C83 82, 88 87, 86 96 Z" fill="#fef08a"/>

  <!-- Malankara Cross at Top -->
  <g transform="translate(80, 26) scale(0.65)" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)">
    <!-- Vertical beam -->
    <rect x="-2" y="-12" width="4" height="24" rx="1"/>
    <!-- Horizontal beam -->
    <rect x="-9" y="-6" width="18" height="4" rx="1"/>
    <!-- Budded Trefoil ends -->
    <circle cx="0" cy="-14" r="2.5"/>
    <circle cx="-11" cy="-4" r="2.5"/>
    <circle cx="11" cy="-4" r="2.5"/>
    <!-- 3-step Calvary base -->
    <rect x="-5" y="12" width="10" height="2" fill="#d4972e"/>
    <rect x="-8" y="14" width="16" height="2" fill="#d4972e"/>
    <rect x="-11" y="16" width="22" height="2" fill="#d4972e"/>
  </g>

  <!-- Holy Spirit Dove (Flying Downward) -->
  <g transform="translate(80, 56) scale(0.85)" fill="#ffffff" filter="url(#shadow)">
    <!-- Wings spread -->
    <path d="M0 -4 C-12 -16, -26 -12, -32 -2 C-20 -2, -10 4, 0 8 C10 4, 20 -2, 32 -2 C26 -12, 12 -16, 0 -4 Z"/>
    <!-- Body & Head pointing down -->
    <path d="M-4 2 C-4 -6, 4 -6, 4 2 C4 8, 2 15, 0 18 C-2 15, -4 8, -4 2 Z"/>
    <!-- Tail feathers up -->
    <path d="M-6 -8 C-8 -18, -2 -22, 0 -22 C2 -22, 8 -18, 6 -8 Z" fill="#e2e8f0"/>
    <!-- Olive branch beak highlight -->
    <circle cx="0" cy="19" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Youth Figures (Forward Momentum Silhouette) -->
  <g transform="translate(80, 92)" fill="url(#goldGrad)" opacity="0.95">
    <!-- Center Youth -->
    <circle cx="0" cy="-8" r="3.5"/>
    <path d="M-7 4 C-7 -3, 7 -3, 7 4 L5 12 L-5 12 Z"/>
    <!-- Left Youth -->
    <circle cx="-13" cy="-5" r="3"/>
    <path d="M-19 5 C-19 -1, -7 -1, -7 5 L-9 12 L-17 12 Z" opacity="0.8"/>
    <!-- Right Youth -->
    <circle cx="13" cy="-5" r="3"/>
    <path d="M7 5 C7 -1, 19 -1, 19 5 L17 12 L9 12 Z" opacity="0.8"/>
  </g>

  <!-- Ribbon Banner for MCYM -->
  <path d="M30 115 L42 108 L118 108 L130 115 L118 122 L42 122 Z" fill="#b91c1c" stroke="#d4972e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="118.5" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">MCYM</text>

  <!-- Arch Text around Upper Border -->
  <path id="textArcMcym" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.8" font-weight="700" fill="#cbd5e1" letter-spacing="1">
    <textPath href="#textArcMcym" startOffset="50%" text-anchor="middle">
      MALANKARA CATHOLIC YOUTH MOVEMENT
    </textPath>
  </text>

  <!-- Bottom Parish / Region Arc -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">ODANAVATTOM UNIT</text>
  <circle cx="48" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="112" cy="135" r="1.5" fill="#d4972e"/>
</svg>
