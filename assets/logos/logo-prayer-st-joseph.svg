<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="stjBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#02140e"/>
    </radialGradient>
    <linearGradient id="stjGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#855909"/>
    </linearGradient>
    <filter id="stjShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#stjBg)" stroke="url(#stjGold)" stroke-width="4" filter="url(#stjShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Glory Beams -->
  <g stroke="#fef08a" stroke-width="1" opacity="0.3">
    <line x1="80" y1="52" x2="80" y2="26"/>
    <line x1="80" y1="52" x2="56" y2="32"/>
    <line x1="80" y1="52" x2="104" y2="32"/>
    <line x1="80" y1="52" x2="42" y2="52"/>
    <line x1="80" y1="52" x2="118" y2="52"/>
  </g>

  <!-- St. Joseph's Carpenter Square & Blooming Staff -->
  <g transform="translate(80, 56)" filter="url(#stjShadow)">
    <!-- Cross on top -->
    <rect x="-2" y="-32" width="4" height="18" fill="url(#stjGold)" rx="1"/>
    <rect x="-9" y="-26" width="18" height="4" fill="url(#stjGold)" rx="1"/>
    <circle cx="0" cy="-33" r="2" fill="#fef08a"/>

    <!-- Carpenter's Square (L-Square) -->
    <path d="M-18 -10 L16 -10 L16 -5 L-12 -5 L-12 14 L-18 14 Z" fill="url(#stjGold)" stroke="#fef08a" stroke-width="0.8"/>

    <!-- Blooming Lily of St. Joseph (Flowering Staff) -->
    <path d="M6 14 L6 -16" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lily petals -->
    <path d="M6 -16 C2 -22, -2 -24, 0 -28 C4 -26, 6 -20, 6 -16 Z" fill="#fef08a"/>
    <path d="M6 -16 C10 -22, 14 -24, 12 -28 C8 -26, 6 -20, 6 -16 Z" fill="#fef08a"/>
    <path d="M6 -16 C6 -24, 5 -27, 6 -30 C7 -27, 6 -24, 6 -16 Z" fill="#ffffff"/>
  </g>

  <!-- Praying Family Hands & Sacred Shelter -->
  <g transform="translate(80, 89)" filter="url(#stjShadow)">
    <path d="M-22 10 L0 -4 L22 10" stroke="url(#stjGold)" stroke-width="1.8" fill="none"/>
    <path d="M-6 8 C-7 0, -4 -8, 0 -12 C4 -8, 7 0, 6 8 C4 14, -4 14, -6 8 Z" fill="#f8fafc" stroke="#d4972e" stroke-width="1.2"/>
    <line x1="0" y1="-12" x2="0" y2="10" stroke="#d4972e" stroke-width="1"/>
  </g>

  <!-- Ribbon Banner -->
  <path d="M16 114 L28 107 L132 107 L144 114 L132 121 L28 121 Z" fill="#047857" stroke="url(#stjGold)" stroke-width="1.5" filter="url(#stjShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">ST. JOSEPH UNIT</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcStj" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.1" font-weight="700" fill="#cbd5e1" letter-spacing="0.8">
    <textPath href="#textArcStj" startOffset="50%" text-anchor="middle">
      GUARDIAN OF FAMILIES • MAR YOWSEPPITA
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">PRAYER GROUP 3 • ODANAVATTOM</text>
  <circle cx="36" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="124" cy="135" r="1.5" fill="#d4972e"/>
</svg>
