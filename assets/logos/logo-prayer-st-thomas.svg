<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="sttBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="sttGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#855909"/>
    </linearGradient>
    <filter id="sttShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#sttBg)" stroke="url(#sttGold)" stroke-width="4" filter="url(#sttShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Glory Beams -->
  <g stroke="#fef08a" stroke-width="1" opacity="0.3">
    <line x1="80" y1="52" x2="80" y2="26"/>
    <line x1="80" y1="52" x2="56" y2="32"/>
    <line x1="80" y1="52" x2="104" y2="32"/>
    <line x1="80" y1="52" x2="42" y2="52"/>
    <line x1="80" y1="52" x2="118" y2="52"/>
  </g>

  <!-- Laurel Garland of Apostle St. Thomas -->
  <g stroke="url(#sttGold)" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M42 98 C34 76, 40 50, 56 36"/>
    <circle cx="44" cy="82" r="2" fill="#d4972e"/>
    <circle cx="39" cy="68" r="2" fill="#d4972e"/>
    <circle cx="42" cy="54" r="2" fill="#d4972e"/>
    <circle cx="50" cy="42" r="2" fill="#d4972e"/>
    <path d="M118 98 C126 76, 120 50, 104 36"/>
    <circle cx="116" cy="82" r="2" fill="#d4972e"/>
    <circle cx="121" cy="68" r="2" fill="#d4972e"/>
    <circle cx="118" cy="54" r="2" fill="#d4972e"/>
    <circle cx="110" cy="42" r="2" fill="#d4972e"/>
  </g>

  <!-- Apostolic Spear & St. Thomas Cross -->
  <g transform="translate(80, 52)" fill="url(#sttGold)" stroke="url(#sttGold)" stroke-width="1.5" filter="url(#sttShadow)">
    <!-- Central Malankara Cross -->
    <rect x="-2.5" y="-22" width="5" height="30" rx="1"/>
    <rect x="-13" y="-12" width="26" height="5" rx="1"/>
    <!-- Cross trefoils -->
    <circle cx="0" cy="-24" r="2.8"/>
    <circle cx="-15" cy="-9.5" r="2.8"/>
    <circle cx="15" cy="-9.5" r="2.8"/>

    <!-- Holy Gospel Book of Mar Thoma -->
    <rect x="-10" y="9" width="20" height="14" rx="2" fill="#0f172a" stroke="url(#sttGold)" stroke-width="1.2"/>
    <line x1="0" y1="9" x2="0" y2="23" stroke="url(#sttGold)" stroke-width="1"/>
    <!-- Alpha and Omega on book -->
    <text x="-5" y="19" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#fef08a">A</text>
    <text x="3" y="19" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#fef08a">&#937;</text>
  </g>

  <!-- Praying Family Hands -->
  <g transform="translate(80, 89)" filter="url(#sttShadow)">
    <path d="M-22 10 L0 -4 L22 10" stroke="url(#sttGold)" stroke-width="1.8" fill="none"/>
    <path d="M-6 8 C-7 0, -4 -8, 0 -12 C4 -8, 7 0, 6 8 C4 14, -4 14, -6 8 Z" fill="#f8fafc" stroke="#d4972e" stroke-width="1.2"/>
    <line x1="0" y1="-12" x2="0" y2="10" stroke="#d4972e" stroke-width="1"/>
  </g>

  <!-- Ribbon Banner -->
  <path d="M16 114 L28 107 L132 107 L144 114 L132 121 L28 121 Z" fill="#312e81" stroke="url(#sttGold)" stroke-width="1.5" filter="url(#sttShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">ST. THOMAS UNIT</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcStt" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#cbd5e1" letter-spacing="0.8">
    <textPath href="#textArcStt" startOffset="50%" text-anchor="middle">
      MY LORD AND MY GOD • MARAN WA-ALAHAN
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">PRAYER GROUP 1 • ODANAVATTOM</text>
  <circle cx="36" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="124" cy="135" r="1.5" fill="#d4972e"/>
</svg>
