<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="kudumbaBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="65%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="kudumbaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#92620c"/>
    </linearGradient>
    <linearGradient id="warmHearth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="kudumbaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#kudumbaBg)" stroke="url(#kudumbaGold)" stroke-width="4" filter="url(#kudumbaShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Sheltering Roofline / Church Arch of the Domestic Church -->
  <path d="M40 68 L80 34 L120 68" fill="none" stroke="url(#kudumbaGold)" stroke-width="3" stroke-linecap="round" filter="url(#kudumbaShadow)"/>
  
  <!-- Cross on Gabled Roof -->
  <g transform="translate(80, 24) scale(0.65)" fill="url(#kudumbaGold)" stroke="url(#kudumbaGold)" stroke-width="1.5">
    <rect x="-2" y="-10" width="4" height="20" rx="1"/>
    <rect x="-8" y="-5" width="16" height="4" rx="1"/>
    <circle cx="0" cy="-12" r="2"/>
    <circle cx="-10" cy="-3" r="2"/>
    <circle cx="10" cy="-3" r="2"/>
  </g>

  <!-- Central Glowing Candle of Household Prayer -->
  <g transform="translate(80, 68)" filter="url(#kudumbaShadow)">
    <path d="M0 -12 C-2.5 -7, -2.5 -3, 0 1 C2.5 -3, 2.5 -7, 0 -12 Z" fill="url(#warmHearth)"/>
    <rect x="-2" y="1" width="4" height="14" fill="#ffffff" rx="1"/>
    <ellipse cx="0" cy="15" rx="5" ry="1.5" fill="url(#kudumbaGold)"/>
  </g>

  <!-- Family Silhouettes Gathered in Unity -->
  <!-- Father (Left) -->
  <g transform="translate(60, 64)" fill="#ffffff" filter="url(#kudumbaShadow)">
    <circle cx="0" cy="0" r="4.5" fill="#fef08a"/>
    <path d="M-6 10 C-6 5, 6 5, 6 10 L8 28 L-8 28 Z" fill="#f8fafc"/>
  </g>

  <!-- Mother (Right) -->
  <g transform="translate(100, 65)" fill="#ffffff" filter="url(#kudumbaShadow)">
    <circle cx="0" cy="0" r="4" fill="#fef08a"/>
    <path d="M-6 9 C-6 4, 6 4, 6 9 L7 27 L-7 27 Z" fill="#e2e8f0"/>
  </g>

  <!-- Children (Front Center) -->
  <g transform="translate(73, 76)" fill="url(#kudumbaGold)">
    <circle cx="0" cy="0" r="3"/>
    <path d="M-4 6 C-4 3, 4 3, 4 6 L4 16 L-4 16 Z"/>
  </g>
  <g transform="translate(87, 76)" fill="url(#kudumbaGold)">
    <circle cx="0" cy="0" r="3"/>
    <path d="M-4 6 C-4 3, 4 3, 4 6 L4 16 L-4 16 Z"/>
  </g>

  <!-- Open Family Scripture beneath -->
  <g transform="translate(80, 96)" filter="url(#kudumbaShadow)">
    <path d="M-22 -2 C-12 -5, -4 -2, 0 1 C4 -2, 12 -5, 22 -2 L20 10 C12 7, 4 9, 0 11 C-4 9, -12 7, -20 10 Z" fill="#f8fafc" stroke="url(#kudumbaGold)" stroke-width="1.2"/>
    <path d="M0 1 L0 11" stroke="url(#kudumbaGold)" stroke-width="1.2"/>
  </g>

  <!-- Ribbon Banner for Kudumba Koottayma -->
  <path d="M22 114 L34 107 L126 107 L138 114 L126 121 L34 121 Z" fill="#15803d" stroke="url(#kudumbaGold)" stroke-width="1.5" filter="url(#kudumbaShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">KUDUMBA KOOTTAYMA</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcKudumba" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#cbd5e1" letter-spacing="0.7">
    <textPath href="#textArcKudumba" startOffset="50%" text-anchor="middle">
      WARD FAMILY PRAYER UNITS
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">ODANAVATTOM PARISH</text>
  <circle cx="44" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="116" cy="135" r="1.5" fill="#d4972e"/>
</svg>
