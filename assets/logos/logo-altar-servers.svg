<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="altarBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="70%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </radialGradient>
    <linearGradient id="altarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#92620c"/>
    </linearGradient>
    <linearGradient id="candleFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="altarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#altarBg)" stroke="url(#altarGold)" stroke-width="4" filter="url(#altarShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Divine Eucharistic Rays of Light -->
  <g stroke="#fef08a" stroke-width="1.2" opacity="0.4">
    <line x1="80" y1="46" x2="80" y2="24"/>
    <line x1="80" y1="46" x2="56" y2="28"/>
    <line x1="80" y1="46" x2="104" y2="28"/>
    <line x1="80" y1="46" x2="38" y2="40"/>
    <line x1="80" y1="46" x2="122" y2="40"/>
  </g>

  <!-- Consecrated Holy Eucharist (Host) hovering above Chalice -->
  <g transform="translate(80, 44)" filter="url(#altarShadow)">
    <circle cx="0" cy="0" r="12" fill="#f8fafc" stroke="url(#altarGold)" stroke-width="1.5"/>
    <!-- Cross on Host -->
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#d4972e" stroke-width="1.6"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#d4972e" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="1.5" fill="#d4972e"/>
  </g>

  <!-- Holy Altar Chalice (Khaso) -->
  <g transform="translate(80, 78)" filter="url(#altarShadow)">
    <!-- Cup -->
    <path d="M-14 -18 C-14 -4, 14 -4, 14 -18 Z" fill="url(#altarGold)"/>
    <ellipse cx="0" cy="-18" rx="14" ry="3" fill="#fef08a"/>
    <!-- Stem & Node -->
    <rect x="-3" y="-4" width="6" height="14" fill="url(#altarGold)"/>
    <circle cx="0" cy="2" r="5" fill="url(#altarGold)"/>
    <!-- Base -->
    <path d="M-4 10 L4 10 L16 18 L-16 18 Z" fill="url(#altarGold)"/>
    <ellipse cx="0" cy="18" rx="16" ry="3" fill="url(#altarGold)"/>
  </g>

  <!-- Left Altar Candle -->
  <g transform="translate(48, 64)" filter="url(#altarShadow)">
    <!-- Flame -->
    <path d="M0 -14 C-2.5 -8, -2.5 -3, 0 1 C2.5 -3, 2.5 -8, 0 -14 Z" fill="url(#candleFlame)"/>
    <!-- Wick -->
    <line x1="0" y1="1" x2="0" y2="4" stroke="#475569" stroke-width="1"/>
    <!-- Candle body -->
    <rect x="-3.5" y="4" width="7" height="32" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Candlestick holder -->
    <ellipse cx="0" cy="36" rx="8" ry="2.5" fill="url(#altarGold)"/>
  </g>

  <!-- Right Altar Candle -->
  <g transform="translate(112, 64)" filter="url(#altarShadow)">
    <!-- Flame -->
    <path d="M0 -14 C-2.5 -8, -2.5 -3, 0 1 C2.5 -3, 2.5 -8, 0 -14 Z" fill="url(#candleFlame)"/>
    <!-- Wick -->
    <line x1="0" y1="1" x2="0" y2="4" stroke="#475569" stroke-width="1"/>
    <!-- Candle body -->
    <rect x="-3.5" y="4" width="7" height="32" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Candlestick holder -->
    <ellipse cx="0" cy="36" rx="8" ry="2.5" fill="url(#altarGold)"/>
  </g>

  <!-- Ribbon Banner for Altar Servers -->
  <path d="M26 114 L38 107 L122 107 L134 114 L122 121 L38 121 Z" fill="#991b1b" stroke="url(#altarGold)" stroke-width="1.5" filter="url(#altarShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ALTAR SERVERS</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcAltar" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.3" font-weight="700" fill="#cbd5e1" letter-spacing="0.7">
    <textPath href="#textArcAltar" startOffset="50%" text-anchor="middle">
      KNIGHTS OF THE ALTAR • MADBAHA
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">ODANAVATTOM PARISH</text>
  <circle cx="44" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="116" cy="135" r="1.5" fill="#d4972e"/>
</svg>
