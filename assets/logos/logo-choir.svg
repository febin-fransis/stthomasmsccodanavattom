<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="choirBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="choirGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#92620c"/>
    </linearGradient>
    <filter id="choirShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#choirBg)" stroke="url(#choirGold)" stroke-width="4" filter="url(#choirShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Divine Musical Radiance -->
  <g stroke="#fef08a" stroke-width="1" opacity="0.3">
    <line x1="80" y1="46" x2="80" y2="26"/>
    <line x1="80" y1="46" x2="58" y2="32"/>
    <line x1="80" y1="46" x2="102" y2="32"/>
    <line x1="80" y1="46" x2="40" y2="48"/>
    <line x1="80" y1="46" x2="120" y2="48"/>
  </g>

  <!-- Cross at Top -->
  <g transform="translate(80, 26) scale(0.6)" fill="url(#choirGold)" stroke="url(#choirGold)" stroke-width="1.5">
    <rect x="-2" y="-10" width="4" height="20" rx="1"/>
    <rect x="-8" y="-5" width="16" height="4" rx="1"/>
    <circle cx="0" cy="-12" r="2"/>
    <circle cx="-10" cy="-3" r="2"/>
    <circle cx="10" cy="-3" r="2"/>
  </g>

  <!-- Classical Liturgical Lyre / Harp -->
  <g transform="translate(80, 68)" filter="url(#choirShadow)">
    <!-- Lyre Arms -->
    <path d="M-22 -24 C-26 -10, -22 8, 0 16 C22 8, 26 -10, 22 -24 C19 -24, 16 -12, 0 8 C-16 -12, -19 -24, -22 -24 Z" fill="url(#choirGold)"/>
    <!-- Top Crossbar -->
    <rect x="-20" y="-22" width="40" height="4.5" rx="2" fill="url(#choirGold)"/>
    <!-- Lyre Base Foot -->
    <rect x="-8" y="16" width="16" height="4" rx="1" fill="url(#choirGold)"/>
    <ellipse cx="0" cy="21" rx="12" ry="2.5" fill="url(#choirGold)"/>
    <!-- Strings -->
    <line x1="-12" y1="-18" x2="-6" y2="12" stroke="#fef08a" stroke-width="1"/>
    <line x1="-6" y1="-18" x2="-2" y2="14" stroke="#fef08a" stroke-width="1"/>
    <line x1="0" y1="-18" x2="0" y2="15" stroke="#fef08a" stroke-width="1"/>
    <line x1="6" y1="-18" x2="2" y2="14" stroke="#fef08a" stroke-width="1"/>
    <line x1="12" y1="-18" x2="6" y2="12" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Syriac Incense Censer (Dhoopakutti / Thurible) swinging on left -->
  <g transform="translate(42, 70) scale(0.65)" filter="url(#choirShadow)">
    <!-- Chains -->
    <line x1="0" y1="-18" x2="-4" y2="4" stroke="url(#choirGold)" stroke-width="1.2"/>
    <line x1="0" y1="-18" x2="4" y2="4" stroke="url(#choirGold)" stroke-width="1.2"/>
    <circle cx="0" cy="-18" r="3" fill="url(#choirGold)"/>
    <!-- Censer Cup -->
    <path d="M-6 4 L6 4 L4 16 L-4 16 Z" fill="url(#choirGold)"/>
    <path d="M-6 4 C-6 -2, 6 -2, 6 4 Z" fill="#fef08a" opacity="0.8"/>
    <!-- Smoke curl -->
    <path d="M0 -3 C-3 -9, 2 -12, -1 -18" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Musical Notes on right -->
  <g transform="translate(118, 64) scale(0.75)" fill="url(#choirGold)">
    <!-- Eighth note pair -->
    <circle cx="-6" cy="8" r="3"/>
    <circle cx="6" cy="4" r="3"/>
    <rect x="-4" y="-8" width="2" height="16"/>
    <rect x="8" y="-12" width="2" height="16"/>
    <polygon points="-4,-8 10,-12 10,-8 -4,-4"/>
  </g>

  <!-- Ribbon Banner for Choir -->
  <path d="M26 114 L38 107 L122 107 L134 114 L122 121 L38 121 Z" fill="#581c87" stroke="url(#choirGold)" stroke-width="1.5" filter="url(#choirShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PARISH CHOIR</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcChoir" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.3" font-weight="700" fill="#cbd5e1" letter-spacing="0.7">
    <textPath href="#textArcChoir" startOffset="50%" text-anchor="middle">
      LITURGICAL MUSIC MINISTRY
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">ODANAVATTOM PARISH</text>
  <circle cx="44" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="116" cy="135" r="1.5" fill="#d4972e"/>
</svg>
