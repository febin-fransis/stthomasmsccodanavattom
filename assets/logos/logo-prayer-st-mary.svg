<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="stmBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="stmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d4972e"/>
      <stop offset="100%" stop-color="#855909"/>
    </linearGradient>
    <filter id="stmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#stmBg)" stroke="url(#stmGold)" stroke-width="4" filter="url(#stmShadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#d4972e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- 12 Marian Stars -->
  <g fill="#fef08a" opacity="0.85">
    <!-- Circle of 12 stars around halo -->
    <path d="M80 18 L81.5 22 L85 22 L82.5 24 L83.5 28 L80 25.5 L76.5 28 L77.5 24 L75 22 L78.5 22 Z"/>
    <path d="M102 24 L103.5 28 L107 28 L104.5 30 L105.5 34 L102 31.5 L98.5 34 L99.5 30 L97 28 L100.5 28 Z"/>
    <path d="M118 40 L119.5 44 L123 44 L120.5 46 L121.5 50 L118 47.5 L114.5 50 L115.5 46 L113 44 L116.5 44 Z"/>
    <path d="M58 24 L59.5 28 L63 28 L60.5 30 L61.5 34 L58 31.5 L54.5 34 L55.5 30 L53 28 L56.5 28 Z"/>
    <path d="M42 40 L43.5 44 L47 44 L44.5 46 L45.5 50 L42 47.5 L38.5 50 L39.5 46 L37 44 L40.5 44 Z"/>
  </g>

  <!-- Marian Monogram (A & M) & Lily of Purity -->
  <g transform="translate(80, 56)" filter="url(#stmShadow)">
    <!-- Lily Flowers on either side -->
    <path d="M-28 6 C-34 0, -32 -8, -26 -12 C-24 -4, -20 2, -24 8 Z" fill="url(#stmGold)" opacity="0.8"/>
    <path d="M28 6 C34 0, 32 -8, 26 -12 C24 -4, 20 2, 24 8 Z" fill="url(#stmGold)" opacity="0.8"/>
    
    <!-- Cross on top of Monogram -->
    <rect x="-2" y="-30" width="4" height="18" fill="url(#stmGold)" rx="1"/>
    <rect x="-9" y="-24" width="18" height="4" fill="url(#stmGold)" rx="1"/>
    <circle cx="0" cy="-31" r="2" fill="#fef08a"/>

    <!-- Marian M monogram entwined with A (Ave Maria) -->
    <path d="M-18 6 L-10 -14 L0 -2 L10 -14 L18 6" stroke="url(#stmGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-12 12 L0 -10 L12 12" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="-7" y1="4" x2="7" y2="4" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="0" cy="-2" r="3" fill="#fef08a"/>
  </g>

  <!-- Praying Hands & Domestic Sanctuary -->
  <g transform="translate(80, 89)" filter="url(#stmShadow)">
    <path d="M-22 10 L0 -4 L22 10" stroke="url(#stmGold)" stroke-width="1.8" fill="none"/>
    <path d="M-6 8 C-7 0, -4 -8, 0 -12 C4 -8, 7 0, 6 8 C4 14, -4 14, -6 8 Z" fill="#f8fafc" stroke="#d4972e" stroke-width="1.2"/>
    <line x1="0" y1="-12" x2="0" y2="10" stroke="#d4972e" stroke-width="1"/>
  </g>

  <!-- Ribbon Banner -->
  <path d="M16 114 L28 107 L132 107 L144 114 L132 121 L28 121 Z" fill="#1d4ed8" stroke="url(#stmGold)" stroke-width="1.5" filter="url(#stmShadow)"/>
  <text x="80" y="117.5" font-family="'Cinzel', 'Georgia', serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">ST. MARY'S UNIT</text>

  <!-- Arch Text Upper Border -->
  <path id="textArcStm" d="M 28 84 A 56 56 0 0 1 132 84" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#cbd5e1" letter-spacing="0.8">
    <textPath href="#textArcStm" startOffset="50%" text-anchor="middle">
      DO WHATEVER HE TELLS YOU • YOLDATH ALOHO
    </textPath>
  </text>

  <!-- Bottom Subtitle -->
  <text x="80" y="137" font-family="'Inter', sans-serif" font-size="6.2" font-weight="700" fill="#d4972e" text-anchor="middle" letter-spacing="1.2">PRAYER GROUP 2 • ODANAVATTOM</text>
  <circle cx="36" cy="135" r="1.5" fill="#d4972e"/>
  <circle cx="124" cy="135" r="1.5" fill="#d4972e"/>
</svg>
